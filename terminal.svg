
<svg xmlns="http://www.w3.org/2000/svg" width="850" height="245" viewBox="0 0 850 245">

  <defs>
    <clipPath id="window">
      <rect x="1" y="1" width="848" height="243" rx="12"/>
    </clipPath>
    <clipPath id="typing">
      <rect x="52" y="177" width="0" height="30">
        <animate attributeName="width"
          values="0;650;650;0;0"
          keyTimes="0;0.22;0.78;0.95;1"
          dur="5s"
          repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Terminal Window -->
  <rect x="1" y="1" width="848" height="243"
        rx="12" fill="#111827" stroke="#334155"/>

  <!-- Title Bar -->
  <g clip-path="url(#window)">
    <rect width="850" height="42" fill="#1e293b"/>
  </g>

  <!-- Window Controls -->
  <circle cx="23" cy="21" r="6" fill="#ff5f57"/>
  <circle cx="43" cy="21" r="6" fill="#febc2e"/>
  <circle cx="63" cy="21" r="6" fill="#28c840"/>

  <text x="425" y="26" text-anchor="middle"
        fill="#94a3b8" font-family="monospace"
        font-size="14">developer.ts</text>

  <!-- Introduction -->
  <g font-family="monospace">

    <text x="28" y="78" fill="#4ade80" font-size="17">$</text>
    <text x="52" y="78" fill="#cbd5e1" font-size="17">whoami</text>

    <text x="28" y="121" fill="#7dd3fc"
          font-size="34" font-weight="bold">Kruti Jaiswal</text>

    <text x="28" y="151" fill="#94a3b8"
          font-size="17">Aspiring Software Developer</text>

    <text x="28" y="199" fill="#4ade80" font-size="17">$</text>

    <!-- Animated Text -->
    <g clip-path="url(#typing)" fill="#e2e8f0" font-size="17">

      <text x="52" y="199" opacity="1">
        Building applications...
        <animate attributeName="opacity"
          values="1;0;0;0" dur="20s"
          calcMode="discrete" repeatCount="indefinite"/>
      </text>

      <text x="52" y="199" opacity="0">
        Exploring new technologies...
        <animate attributeName="opacity"
          values="0;1;0;0" dur="20s"
          calcMode="discrete" repeatCount="indefinite"/>
      </text>

      <text x="52" y="199" opacity="0">
        Solving problems through code...
        <animate attributeName="opacity"
          values="0;0;1;0" dur="20s"
          calcMode="discrete" repeatCount="indefinite"/>
      </text>

      <text x="52" y="199" opacity="0">
        Learn. Build. Improve.
        <animate attributeName="opacity"
          values="0;0;0;1" dur="20s"
          calcMode="discrete" repeatCount="indefinite"/>
      </text>

    </g>

    <!-- Blinking Cursor -->
    <rect x="52" y="183" width="9" height="20" fill="#4ade80">
      <animate attributeName="x"
        values="52;400;400;52;52"
        keyTimes="0;0.22;0.78;0.95;1"
        dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity"
        values="1;0;1" dur="1s"
        repeatCount="indefinite"/>
    </rect>

  </g>
</svg>
